# dsh-429-auto-continue bundle patch: inserts the host plugin row into the
# profile roster (the `dsh.bundle.patch` manifest field).
#
# All settings are editable from the dsh web GUI (设置 → 429 自动继续):
#   enable            — 总开关（false 时完全不监听、不发送）
#   delayMs           — 429 后等待多少毫秒再自动发送（默认 10000 = 10 秒）
#   message           — 自动发送的文本（默认「继续任务」）
#   codes             — 触发自动发送的错误码白名单（默认 RATE_LIMIT / QUOTA；
#                       商汤 SenseNova 的 429 insufficient_quota 归类为 QUOTA）
#   excludeSubagents  — 是否排除子会话（默认 true）
#   maxContinues      — 同一会话连续自动继续的次数上限（默认 3，0 = 不限；
#                       防止 429 反复触发时无限循环消耗配额）
- insert:
    - id: 429-auto-continue
      name: dsh-429-auto-continue
